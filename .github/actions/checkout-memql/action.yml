name: Checkout memql sibling
description: >
  Check out znasllc-io/memql at ./memql, pinned to the single sha recorded in
  .github/memql-pin. Every lane that needs the sibling for the ../memql replace
  directive goes through here, so no lane can silently track an unpinned main
  while memql is mid module-split (memql#3228).

inputs:
  token:
    description: >
      Token used to read the sibling repository. Dependabot runs use a
      restricted token that cannot read sibling repos; callers pass
      MEMQL_SIBLING_TOKEN with a fallback to the default token.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve the memql pin
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        pin_file="${{ github.action_path }}/../../memql-pin"
        if [[ ! -f "$pin_file" ]]; then
          echo "::error::.github/memql-pin is missing; the memql sibling pin has no source of truth"
          exit 1
        fi
        sha="$(grep -vE '^[[:space:]]*(#|$)' "$pin_file" | head -1 | tr -d '[:space:]')"
        if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::.github/memql-pin must hold a full 40-character commit sha, got '${sha}'"
          exit 1
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "memql sibling pinned to $sha"

    - name: Checkout memql
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: znasllc-io/memql
        ref: ${{ steps.pin.outputs.sha }}
        path: memql
        token: ${{ inputs.token }}
