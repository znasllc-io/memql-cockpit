name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# memql-cockpit's go.mod points at ../memql/ via a `replace` directive for
# local development. CI mirrors that layout: check out both repos as siblings,
# then run from inside memql-cockpit.

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for the ../memql replace directive, pinned)
        # Pinned via .github/memql-pin -- see that file and go.mod. memql is
        # mid module-split (memql#3228) and an unpinned main breaks cockpit the
        # moment any nested go.mod lands.
        uses: ./memql-cockpit/.github/actions/checkout-memql
        with:
          # Dependabot's restricted token can't read the sibling repo;
          # MEMQL_SIBLING_TOKEN (Dependabot secret) covers that, with a
          # fallback to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: go build (headless)
        working-directory: memql-cockpit
        run: go build ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for the ../memql replace directive, pinned)
        # Pinned via .github/memql-pin -- see that file and go.mod. memql is
        # mid module-split (memql#3228) and an unpinned main breaks cockpit the
        # moment any nested go.mod lands.
        uses: ./memql-cockpit/.github/actions/checkout-memql
        with:
          # Dependabot's restricted token can't read the sibling repo;
          # MEMQL_SIBLING_TOKEN (Dependabot secret) covers that, with a
          # fallback to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: go test
        working-directory: memql-cockpit
        # -race: the worker holds one gRPC stream that many goroutines
        # write (heartbeat, pong, tool results, model deltas, pulls, app
        # sessions), and the runner's loop, hold and drain run beside them
        # (memql-cockpit#426, #434). The lock is in the SDK; the tests in
        # internal/worker/connect_send_test.go and loop_run_test.go have
        # nothing to catch without the detector. The suite is race-clean;
        # the timeout is doubled for the detector's overhead on the runner.
        run: go test -race -count=1 -timeout=600s ./...

  # fuzz runs every native Go fuzz target for a short burst.
  #
  # THE SEEDS ALREADY RUN IN `go test`; this job is what makes the targets
  # more than a corpus of hand-written cases. Each one asserts a security
  # PROPERTY rather than a value -- a filename that cannot escape a
  # directory, a bearer that cannot survive redaction, two tool calls whose
  # arguments cannot merge -- and those are properties a fixed set of
  # examples cannot establish.
  #
  # A SHORT BURST PER TARGET, not a long one. This runs on every pull
  # request, so the budget is bounded and the value is regression pressure:
  # a change that breaks a property is usually caught in the first seconds,
  # because the corpus in testdata/ is replayed before any new input is
  # generated. Long campaigns belong on a schedule, not in front of a
  # reviewer.
  #
  # A crasher is written to testdata/fuzz/<Target>/ by `go test` itself, so
  # the reproducer is committed with the fix rather than described.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for the ../memql replace directive, pinned)
        uses: ./memql-cockpit/.github/actions/checkout-memql
        with:
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: go test -fuzz
        working-directory: memql-cockpit
        # One target per invocation -- `go test -fuzz` accepts exactly one --
        # so the list is walked. It is DISCOVERED rather than hard-coded: a
        # target added without touching this file still runs, which is the
        # only arrangement that survives somebody adding one.
        #
        # Package and name come from ONE grep pass. A second lookup keyed on
        # the name would have to put `(f *testing.F)` into a pattern, and
        # the parentheses are a regex group the moment the shell has
        # unquoted them -- so the lookup silently matches nothing and
        # dirname is handed an empty string.
        #
        # The pairs are collected into a variable BEFORE the loop, not piped
        # into it. A `while read` on the right of a pipe runs in a subshell,
        # so a `failed` set inside one is lost when the subshell exits, and
        # this job would report success no matter what broke. That is the
        # one failure a fuzz job must not have.
        run: |
          set -euo pipefail
          found="$(
            grep -rn --include='*_test.go' -oE '^func Fuzz[A-Za-z0-9_]*' . |
              awk -F: '{ sub(/^func /, "", $3); sub(/\/[^/]*$/, "", $1); print $1, $3 }' |
              sort -u
          )"
          if [ -z "$found" ]; then
            echo "no fuzz targets found; the discovery pattern has drifted from the code"
            exit 1
          fi
          echo "found $(echo "$found" | wc -l) fuzz targets"
          failed=""
          while read -r pkg target; do
            [ -n "$target" ] || continue
            echo "== $pkg $target"
            if ! go test "$pkg" -run '^$' -fuzz "^${target}$" -fuzztime=20s; then
              failed="$failed $target"
            fi
          done <<EOF
          $found
          EOF
          if [ -n "$failed" ]; then
            echo "fuzz targets failed:$failed"
            exit 1
          fi

  # gofmt is a pure source-formatting check: it needs neither the memql sibling
  # checkout (no compilation) nor CGO. Fail the build on any unformatted file.
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: gofmt -l
        working-directory: memql-cockpit
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for the ../memql replace directive, pinned)
        # Pinned via .github/memql-pin -- see that file and go.mod. memql is
        # mid module-split (memql#3228) and an unpinned main breaks cockpit the
        # moment any nested go.mod lands.
        uses: ./memql-cockpit/.github/actions/checkout-memql
        with:
          # Dependabot's restricted token can't read the sibling repo;
          # MEMQL_SIBLING_TOKEN (Dependabot secret) covers that, with a
          # fallback to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: go vet
        working-directory: memql-cockpit
        run: go vet ./...

  # Compiles + vets the computeruse-tagged code (RobotGo etc.) on both supported
  # platforms. Build + vet ONLY: `go test -tags computeruse` is deliberately omitted —
  # CI runners are headless and the computeruse tests drive a real cursor/display
  # (see #171). Keep the job name short; it appears in branch protection.
  build-computeruse:
    name: build-computeruse
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for the ../memql replace directive, pinned)
        # Pinned via .github/memql-pin -- see that file and go.mod. memql is
        # mid module-split (memql#3228) and an unpinned main breaks cockpit the
        # moment any nested go.mod lands.
        uses: ./memql-cockpit/.github/actions/checkout-memql
        with:
          # Dependabot's restricted token can't read the sibling repo;
          # MEMQL_SIBLING_TOKEN (Dependabot secret) covers that, with a
          # fallback to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: Install X11 dev headers (RobotGo CGO deps)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxtst-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libpng-dev libx11-dev libxi-dev
      - name: go build (computeruse)
        working-directory: memql-cockpit
        run: CGO_ENABLED=1 go build -tags computeruse ./...
      - name: go vet (computeruse)
        working-directory: memql-cockpit
        run: CGO_ENABLED=1 go vet -tags computeruse ./...

  # The memql sibling pin must have exactly ONE source of truth.
  #
  # memql is mid module-split (memql#3228). No static cockpit go.mod is green
  # both before and after a given memql module lands (truth table in go.mod),
  # so every lane has to build against a PINNED memql. A lane that still checks
  # out an unpinned main does not fail today -- it fails on whichever future day
  # a nested go.mod lands, in whichever lane was missed. Converting that into an
  # immediate, obvious failure is what this job is for.
  #
  # Needs no sibling checkout and no Go: it reads this repo's own files.
  memql-pin-guard:
    name: memql-pin-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
      - name: Every memql checkout goes through the pinned composite action
        working-directory: memql-cockpit
        run: |
          set -euo pipefail
          # Anchored at line start so this job's own pattern, which appears
          # mid-line inside a shell assignment, does not match itself.
          bad="$(grep -rlnE '^[[:space:]]*repository:[[:space:]]*znasllc-io/memql' .github/workflows/ || true)"
          if [ -n "$bad" ]; then
            echo "These workflows check out the memql sibling directly rather than"
            echo "through .github/actions/checkout-memql, so they are NOT covered"
            echo "by the .github/memql-pin single source of truth:"
            echo "$bad"
            exit 1
          fi
          echo "all memql checkouts go through the composite action"
      - name: The pin is a resolvable full commit sha
        working-directory: memql-cockpit
        run: |
          set -euo pipefail
          sha="$(grep -vE '^[[:space:]]*(#|$)' .github/memql-pin | head -1 | tr -d '[:space:]')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo ".github/memql-pin must hold a full 40-character commit sha, got '${sha}'"
            exit 1
          fi
          echo "pin ok: $sha"
