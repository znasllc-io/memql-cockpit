name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# memql-cockpit's go.mod points at ../memql/ via a `replace` directive for
# local development. CI mirrors that layout: check out both repos as siblings,
# then run from inside memql-cockpit.

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for replace directive)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: znasllc-io/memql
          path: memql
          # Dependabot runs use a restricted token that can't read other private
          # repos, so the sibling checkout fails there. MEMQL_SIBLING_TOKEN is a
          # fine-grained PAT (contents:read on znasllc-io/memql) added as a
          # Dependabot secret; it falls back to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: go build (headless)
        working-directory: memql-cockpit
        run: go build ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for replace directive)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: znasllc-io/memql
          path: memql
          # Dependabot runs use a restricted token that can't read other private
          # repos, so the sibling checkout fails there. MEMQL_SIBLING_TOKEN is a
          # fine-grained PAT (contents:read on znasllc-io/memql) added as a
          # Dependabot secret; it falls back to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: go test
        working-directory: memql-cockpit
        run: go test -count=1 -timeout=300s ./...

  # gofmt is a pure source-formatting check: it needs neither the memql sibling
  # checkout (no compilation) nor CGO. Fail the build on any unformatted file.
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: memql-cockpit
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: gofmt -l
        working-directory: memql-cockpit
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for replace directive)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: znasllc-io/memql
          path: memql
          # Dependabot runs use a restricted token that can't read other private
          # repos, so the sibling checkout fails there. MEMQL_SIBLING_TOKEN is a
          # fine-grained PAT (contents:read on znasllc-io/memql) added as a
          # Dependabot secret; it falls back to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: go vet
        working-directory: memql-cockpit
        run: go vet ./...

  # Compiles + vets the computeruse-tagged code (RobotGo etc.) on both supported
  # platforms. Build + vet ONLY: `go test -tags computeruse` is deliberately omitted —
  # CI runners are headless and the computeruse tests drive a real cursor/display
  # (see #171). Keep the job name short; it appears in branch protection.
  build-computeruse:
    name: build-computeruse
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for replace directive)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: znasllc-io/memql
          path: memql
          # Dependabot runs use a restricted token that can't read other private
          # repos, so the sibling checkout fails there. MEMQL_SIBLING_TOKEN is a
          # fine-grained PAT (contents:read on znasllc-io/memql) added as a
          # Dependabot secret; it falls back to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: Install X11 dev headers (RobotGo CGO deps)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxtst-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libpng-dev libx11-dev libxi-dev
      - name: go build (computeruse)
        working-directory: memql-cockpit
        run: CGO_ENABLED=1 go build -tags computeruse ./...
      - name: go vet (computeruse)
        working-directory: memql-cockpit
        run: CGO_ENABLED=1 go vet -tags computeruse ./...
