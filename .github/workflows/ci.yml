name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# memql-cockpit's go.mod points at ../memql/ via a `replace` directive for
# local development. CI mirrors that layout: check out both repos as siblings,
# then run from inside memql-cockpit.

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for the ../memql replace directive, pinned)
        # Pinned via .github/memql-pin -- see that file and go.mod. memql is
        # mid module-split (memql#3228) and an unpinned main breaks cockpit the
        # moment any nested go.mod lands.
        uses: ./memql-cockpit/.github/actions/checkout-memql
        with:
          # Dependabot's restricted token can't read the sibling repo;
          # MEMQL_SIBLING_TOKEN (Dependabot secret) covers that, with a
          # fallback to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: go build (headless)
        working-directory: memql-cockpit
        run: go build ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for the ../memql replace directive, pinned)
        # Pinned via .github/memql-pin -- see that file and go.mod. memql is
        # mid module-split (memql#3228) and an unpinned main breaks cockpit the
        # moment any nested go.mod lands.
        uses: ./memql-cockpit/.github/actions/checkout-memql
        with:
          # Dependabot's restricted token can't read the sibling repo;
          # MEMQL_SIBLING_TOKEN (Dependabot secret) covers that, with a
          # fallback to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: go test
        working-directory: memql-cockpit
        run: go test -count=1 -timeout=300s ./...

  # gofmt is a pure source-formatting check: it needs neither the memql sibling
  # checkout (no compilation) nor CGO. Fail the build on any unformatted file.
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: gofmt -l
        working-directory: memql-cockpit
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo "Run 'gofmt -w .' to fix."
            exit 1
          fi

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for the ../memql replace directive, pinned)
        # Pinned via .github/memql-pin -- see that file and go.mod. memql is
        # mid module-split (memql#3228) and an unpinned main breaks cockpit the
        # moment any nested go.mod lands.
        uses: ./memql-cockpit/.github/actions/checkout-memql
        with:
          # Dependabot's restricted token can't read the sibling repo;
          # MEMQL_SIBLING_TOKEN (Dependabot secret) covers that, with a
          # fallback to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: go vet
        working-directory: memql-cockpit
        run: go vet ./...

  # Compiles + vets the computeruse-tagged code (RobotGo etc.) on both supported
  # platforms. Build + vet ONLY: `go test -tags computeruse` is deliberately omitted —
  # CI runners are headless and the computeruse tests drive a real cursor/display
  # (see #171). Keep the job name short; it appears in branch protection.
  build-computeruse:
    name: build-computeruse
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for the ../memql replace directive, pinned)
        # Pinned via .github/memql-pin -- see that file and go.mod. memql is
        # mid module-split (memql#3228) and an unpinned main breaks cockpit the
        # moment any nested go.mod lands.
        uses: ./memql-cockpit/.github/actions/checkout-memql
        with:
          # Dependabot's restricted token can't read the sibling repo;
          # MEMQL_SIBLING_TOKEN (Dependabot secret) covers that, with a
          # fallback to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: Install X11 dev headers (RobotGo CGO deps)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxtst-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libpng-dev libx11-dev libxi-dev
      - name: go build (computeruse)
        working-directory: memql-cockpit
        run: CGO_ENABLED=1 go build -tags computeruse ./...
      - name: go vet (computeruse)
        working-directory: memql-cockpit
        run: CGO_ENABLED=1 go vet -tags computeruse ./...

  # The memql sibling pin must have exactly ONE source of truth.
  #
  # memql is mid module-split (memql#3228). No static cockpit go.mod is green
  # both before and after a given memql module lands (truth table in go.mod),
  # so every lane has to build against a PINNED memql. A lane that still checks
  # out an unpinned main does not fail today -- it fails on whichever future day
  # a nested go.mod lands, in whichever lane was missed. Converting that into an
  # immediate, obvious failure is what this job is for.
  #
  # Needs no sibling checkout and no Go: it reads this repo's own files.
  memql-pin-guard:
    name: memql-pin-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
      - name: Every memql checkout goes through the pinned composite action
        working-directory: memql-cockpit
        run: |
          set -euo pipefail
          # Anchored at line start so this job's own pattern, which appears
          # mid-line inside a shell assignment, does not match itself.
          bad="$(grep -rlnE '^[[:space:]]*repository:[[:space:]]*znasllc-io/memql' .github/workflows/ || true)"
          if [ -n "$bad" ]; then
            echo "These workflows check out the memql sibling directly rather than"
            echo "through .github/actions/checkout-memql, so they are NOT covered"
            echo "by the .github/memql-pin single source of truth:"
            echo "$bad"
            exit 1
          fi
          echo "all memql checkouts go through the composite action"
      - name: The pin is a resolvable full commit sha
        working-directory: memql-cockpit
        run: |
          set -euo pipefail
          sha="$(grep -vE '^[[:space:]]*(#|$)' .github/memql-pin | head -1 | tr -d '[:space:]')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo ".github/memql-pin must hold a full 40-character commit sha, got '${sha}'"
            exit 1
          fi
          echo "pin ok: $sha"
