name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly Mondays 06:00 UTC

# Least-privilege at the workflow level: every step that doesn't
# need to write security-events gets read-only. security-events:
# write is hoisted INTO the analyze job only -- the only place
# SARIF gets uploaded. Closes Scorecard Token-Permissions alert
# #40 / issue #69.
permissions:
  contents: read

# memql-cockpit's go.mod uses a `replace` directive pointing at ../memql/.
# CodeQL's autobuild runs `go build ./...` which fails without that sibling,
# so we lay out both repos as siblings before analysis.

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for the ../memql replace directive, pinned)
        # Pinned via .github/memql-pin -- see that file and go.mod. memql is
        # mid module-split (memql#3228) and an unpinned main breaks cockpit the
        # moment any nested go.mod lands.
        uses: ./memql-cockpit/.github/actions/checkout-memql
        with:
          # Dependabot's restricted token can't read the sibling repo;
          # MEMQL_SIBLING_TOKEN (Dependabot secret) covers that, with a
          # fallback to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          source-root: memql-cockpit
          # Richer suite: security queries + maintainability/quality
          # queries, instead of the default security-only set.
          queries: security-and-quality
      - name: Manual build (replaces autobuild for sibling layout)
        working-directory: memql-cockpit
        run: go build ./...
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:${{ matrix.language }}"
