name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly Mondays 06:00 UTC

permissions:
  actions: read
  contents: read
  security-events: write

# memql-cockpit's go.mod uses a `replace` directive pointing at ../memql/.
# CodeQL's autobuild runs `go build ./...` which fails without that sibling,
# so we lay out both repos as siblings before analysis.

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@v6
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for replace directive)
        uses: actions/checkout@v6
        with:
          repository: znasllc-io/memql
          path: memql
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          source-root: memql-cockpit
      - name: Manual build (replaces autobuild for sibling layout)
        working-directory: memql-cockpit
        run: go build ./...
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
