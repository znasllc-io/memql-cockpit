name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly Mondays 06:00 UTC

# Least-privilege at the workflow level: every step that doesn't
# need to write security-events gets read-only. security-events:
# write is hoisted INTO the analyze job only -- the only place
# SARIF gets uploaded. Closes Scorecard Token-Permissions alert
# #40 / issue #69.
permissions:
  contents: read

# memql-cockpit's go.mod uses a `replace` directive pointing at ../memql/.
# CodeQL's autobuild runs `go build ./...` which fails without that sibling,
# so we lay out both repos as siblings before analysis.

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for replace directive)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: znasllc-io/memql
          path: memql
          # See ci.yml: Dependabot's restricted token can't read the private
          # sibling repo; MEMQL_SIBLING_TOKEN (Dependabot secret) covers that,
          # with a fallback to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - uses: github/codeql-action/init@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4
        with:
          languages: ${{ matrix.language }}
          source-root: memql-cockpit
      - name: Manual build (replaces autobuild for sibling layout)
        working-directory: memql-cockpit
        run: go build ./...
      - uses: github/codeql-action/analyze@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4
        with:
          category: "/language:${{ matrix.language }}"
