name: sbom

# Generate inventory from the artifacts actually shipped. The former module
# graph job tried to resolve unused engine modules at unpublished v0.0.0 refs
# and failed on multiple releases. Reading binary build info avoids inventing
# dependencies and distinguishes headless/computeruse and platform selections.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release with all eight worker binaries
        required: true
        type: string

permissions:
  contents: read

jobs:
  sbom:
    name: cyclonedx-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false
      - name: Install pinned inventory tool
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: Generate and attach per-binary SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir assets sbom
          for flavour in memql memql-computeruse; do
            for platform in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
              asset="${flavour}-${platform}"
              gh release download "$TAG" --dir assets --pattern "$asset"
              chmod +x "assets/$asset"
              # This reads build metadata and hashes, never executes a binary.
              # Local replacements have no published license metadata to fetch;
              # dependency relationships absent from build info remain unknown.
              cyclonedx-gomod bin -version "$TAG" -json -output "sbom/${asset}.cdx.json" "assets/$asset"
              cyclonedx-gomod bin -version "$TAG" -output "sbom/${asset}.cdx.xml" "assets/$asset"
            done
          done
          gh release upload "$TAG" sbom/* --clobber
      - name: Preserve generated SBOMs as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom/
          retention-days: 90
