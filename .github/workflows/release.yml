name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cockpit
        uses: actions/checkout@v7
        with:
          path: memql-cockpit

      - name: Checkout memql (sibling — satisfies the ../memql replace in go.mod)
        uses: actions/checkout@v7
        with:
          repository: znasllc-io/memql
          ref: main
          path: memql

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: memql-cockpit/go.mod

      - name: Tidy modules (sync go.mod/go.sum with the memql sibling)
        working-directory: memql-cockpit
        run: go mod tidy

      - name: Package distributable archives + checksums (headless, all platforms)
        working-directory: memql-cockpit
        run: make dist

      - name: Upload raw binaries to the release
        working-directory: memql-cockpit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" \
            bin/memql-cockpit-darwin-arm64 \
            bin/memql-cockpit-darwin-amd64 \
            bin/memql-cockpit-linux-amd64 \
            bin/memql-cockpit-linux-arm64 \
            --clobber

      - name: Upload distributable archives + SHA256SUMS to the release
        working-directory: memql-cockpit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" dist/*.tar.gz dist/*-SHA256SUMS --clobber
