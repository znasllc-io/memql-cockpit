name: build-cockpit-bff-image

# Builds + pushes the cockpit-bff image to ACR `acrmemql` on the GitHub
# build server (per-client BFF, znasllc-io/memql-cockpit#288). cockpit-bff
# is the Cockpit's own product-neutral BFF -- the engine `bff` role with no
# product DSL -- so the Cockpit connects to cockpit.<domain> without any
# CoPresent dependency.
#
# Cross-repo context: cockpit-bff/go.mod has `replace ../../memql`, so the
# Docker build context spans BOTH memql/ AND memql-cockpit/cockpit-bff/ as
# siblings. This workflow checks out this repo at workspace/memql-cockpit and
# the znasllc-io/memql sibling (PUBLIC -> default GITHUB_TOKEN reads it; no
# PAT) at workspace/memql, then builds with context=workspace.
#
# Auth: GitHub OIDC -> Azure (federated subject
# repo:znasllc-io/memql-cockpit:ref:refs/heads/main, AcrPush; AZURE_* secrets).
# Runs on main via workflow_dispatch. Mirrors the engine + carrier image
# builds; the deployable image is build-server-produced, never a dev laptop.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (e.g. 1.0.0)."
        required: true
        type: string
      engine_ref:
        description: "znasllc-io/memql ref to build cockpit-bff against."
        required: false
        default: main
        type: string
      allow_overwrite:
        description: "Re-push an existing tag (tags are normally immutable)."
        required: false
        default: false
        type: boolean

permissions:
  id-token: write # mint the OIDC token for azure/login
  contents: read

env:
  ACR_NAME: acrmemql
  ACR_LOGIN_SERVER: acrmemql.azurecr.io
  IMAGE: cockpit-bff

jobs:
  build:
    name: build cockpit-bff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cockpit (workspace/memql-cockpit)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: workspace/memql-cockpit
      - name: Checkout memql sibling (workspace/memql)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: znasllc-io/memql
          ref: ${{ inputs.engine_ref }}
          path: workspace/memql

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Immutability guard
        if: ${{ !inputs.allow_overwrite }}
        run: |
          img="${IMAGE}:${{ inputs.version }}"
          if az acr repository show --name "$ACR_NAME" --image "$img" >/dev/null 2>&1; then
            echo "::error::${img} already exists in ${ACR_NAME} -- tags are immutable. Bump version or re-run with allow_overwrite=true." >&2
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v3
      - name: Build + push cockpit-bff
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: workspace
          file: workspace/memql-cockpit/cockpit-bff/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            BUILD_TAGS=bff
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE }}:${{ inputs.version }}
          cache-from: type=gha,scope=cockpit-bff
          cache-to: type=gha,mode=max,scope=cockpit-bff

      - name: Digest summary
        run: |
          {
            echo "### ${IMAGE}:${{ inputs.version }}"
            echo '```'
            echo "${ACR_LOGIN_SERVER}/${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
