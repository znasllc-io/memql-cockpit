name: govulncheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly Mondays 06:00 UTC

permissions:
  contents: read

# memql-cockpit's go.mod has `replace github.com/znasllc-io/memql => ../memql`,
# so vulnerability analysis needs the sibling memql checkout to resolve.
# Mirrors the pattern in ci.yml.

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout memql-cockpit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: memql-cockpit
      - name: Checkout memql (sibling for replace directive)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: znasllc-io/memql
          path: memql
          # See ci.yml: Dependabot's restricted token can't read the private
          # sibling repo; MEMQL_SIBLING_TOKEN (Dependabot secret) covers that,
          # with a fallback to the default token on normal runs.
          token: ${{ secrets.MEMQL_SIBLING_TOKEN || github.token }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: memql-cockpit/go.sum
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: scan
        working-directory: memql-cockpit
        run: govulncheck ./...
