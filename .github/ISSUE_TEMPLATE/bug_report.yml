name: Bug report
description: Report a bug or unexpected behavior in memQL Cockpit
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more specific you can be,
        the faster we can reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: Cockpit version / commit
      description: Output of `git log -1 --pretty=oneline` from the running checkout, or a release tag.
      placeholder: "e.g. b8d9e9c or v0.9.0"
    validations:
      required: true
  - type: dropdown
    id: variant
    attributes:
      label: Build variant
      options:
        - headless (default)
        - computer-use (CGO + RobotGo)
        - worker
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, and any relevant memQL cluster details
      placeholder: "macOS 15.4, Go 1.26.1, local memQL cluster"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what did you observe instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of TUI actions or commands that triggers the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Cockpit log output, worker output, or any other relevant text. Please redact sensitive data.
      render: text
