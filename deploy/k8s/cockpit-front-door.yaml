# cockpit.<domain> -- the raw-gRPC front door for cockpit-bff.
#
# Per-client BFF (#288): the Cockpit dials cockpit.<domain> (see #291), so its
# BFF needs an external gRPC entry the same way the product bff has
# bff.<domain> (memql-bff-copresent/deploy/k8s/product/public-entry.yaml,
# memql#1854). nginx terminates TLS (cert-manager) and forwards h2c gRPC to
# cockpit-bff:50051.
#
# This is the STAGING example; patch the host + tls secret per environment in
# an overlay. Needs a DNS record cockpit.<domain> -> the ingress IP and a
# cert-manager ClusterIssuer (letsencrypt-prod). OWNER-VALIDATED on a cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cockpit-bff-grpc
  namespace: memql
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [cockpit.staging.example.com]
      secretName: cockpit-staging-tls
  rules:
    - host: cockpit.staging.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: cockpit-bff, port: { number: 50051 } } } }
