# cockpit-bff -- the memQL Cockpit's backend-for-frontend node.
#
# Per-client BFF (znasllc-io/memql-cockpit#288): the engine stays
# client-agnostic and each client owns its BFF edge. This is the Cockpit's,
# fronted at cockpit.<domain> (see cockpit-front-door.yaml).
#
# Platform consolidation (znasllc-io/memql#2472, Decision 5): this is now the
# engine's PRODUCT-AGNOSTIC bff image itself (acrmemql.azurecr.io/memql-bff) run
# under a distinct name -- i.e. the Cockpit's instance of the multi-bff model
# (a `bff-<client>`). The bespoke cockpit-bff/ Go module + its build workflow
# are deleted; there is nothing product-specific to compile, so the Cockpit
# just runs the same bff image the engine ships (no DSL bundle mounted).
#
# COEXISTENCE DESIGN (locked #288): a cluster may already run the PRODUCT bff
# (e.g. memql-bff-copresent as service `bff`). cockpit-bff is a DISTINCT
# service so it never hijacks the product edge:
#   - Worker nodes parent to `bff-active:50058` (the product bff), NOT here --
#     so cockpit-bff carries NO MEMQL_WORKER_PEERS and does no AI forwarding.
#   - It serves the Cockpit's read surface only (MemqlService topology /
#     concepts). Deploys ride the deployEngineCluster automation path, not a
#     gRPC call over this connection (see #292), so this node needs no deploy
#     control surface either.
#
# OWNER-VALIDATED: the image tag + the identity-issuer / DB / genesis env must
# match the target cluster; the placeholders below are patched per environment
# the same way the engine base manifests are (mcp.yaml etc.). Validate on a
# rebuilt cluster -- staging is currently torn down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cockpit-bff
  namespace: memql
  labels:
    app.kubernetes.io/name: cockpit-bff
    app.kubernetes.io/part-of: memql
    memql/node-type: bff
    memql/client: cockpit
spec:
  # Single replica: this is a low-traffic ops/read edge (one Cockpit holds one
  # live connection, #239). Scale via an overlay if you want HA parity.
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cockpit-bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cockpit-bff
        app.kubernetes.io/part-of: memql
        memql/node-type: bff
        memql/client: cockpit
    spec:
      volumes:
        - name: memql-ca
          secret:
            secretName: memql-ca
      terminationGracePeriodSeconds: 45
      containers:
        - name: cockpit-bff
          # The engine's product-agnostic bff image (built by memql's
          # build-engine-images.yml, OIDC -> ACR). Pinned per environment.
          # Pin @sha256 per environment via an overlay for staging/prod.
          image: acrmemql.azurecr.io/memql-bff:0.9.9
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          ports:
            - { name: http, containerPort: 8085 }
            - { name: grpc, containerPort: 50051 }
            - { name: node, containerPort: 50058 }
          envFrom:
            - secretRef:
                name: memql-secrets
            - configMapRef:
                name: memql-db-pool
          env:
            - { name: MEMQL_GENESIS_AUTOLOAD, value: "true" }
            - { name: SERVICE_NAME, value: "memQL" }
            - { name: MEMQL_NODE_TYPE, value: "bff" }
            # Distinct service FQDN -- does not collide with the product `bff`.
            - { name: MEMQL_NODE_ADDRESS, value: "cockpit-bff:50058" }
            - { name: MEMQL_NODE_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: MEMQL_DEPLOYMENT_ID, valueFrom: { fieldRef: { fieldPath: "metadata.labels['pod-template-hash']" } } }
            - { name: MEMQL_NODE_SERVICE_ADDRESS, value: ":50058" }
            - { name: MEMQL_GRPC_ADDRESS, value: ":50051" }
            - { name: SERVER_ADDRESS, value: "0.0.0.0:8085" }
            # NOTE: no MEMQL_WORKER_PEERS -- cockpit-bff is a read edge, not the
            # worker parent (workers dial bff-active). See the coexistence note.
            - { name: MEMQL_IDENTITY_VERIFIER_BASE_URL, value: "https://identity:8085" }
            - { name: MEMQL_IDENTITY_VERIFIER_AUDIENCE, value: "memql" }
            # Placeholder issuer -- patch per environment (identity.<domain>).
            - { name: MEMQL_IDENTITY_VERIFIER_EXPECTED_ISSUER, value: "https://identity.staging.example.com" }
            - { name: MEMQL_IDENTITY_ENABLED, value: "false" }
            - { name: MEMQL_HTTP_TLS_CA_FILE, value: "/etc/memql/cacerts/ca.crt" }
            - { name: SSL_CERT_DIR, value: "/etc/ssl/certs:/etc/memql/cacerts" }
            - { name: SERVER_ALLOWED_ORIGINS, value: "*" }
            - { name: MEMORY_NODES_DATABASE_MIGRATE_ON_START, value: "false" }
          volumeMounts:
            - { name: memql-ca, mountPath: /etc/memql/cacerts, readOnly: true }
          startupProbe:
            httpGet: { path: /healthz, port: 8085 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8085 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: 8085 }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cockpit-bff
  namespace: memql
  labels:
    app.kubernetes.io/name: cockpit-bff
    app.kubernetes.io/part-of: memql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cockpit-bff
  ports:
    - { name: node, port: 50058, targetPort: 50058 }
    - { name: http, port: 8085, targetPort: 8085 }
    - { name: grpc, port: 50051, targetPort: 50051 }
